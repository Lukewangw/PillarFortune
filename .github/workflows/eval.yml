name: LLM evaluation

# Runs the offline evaluation harness against Workers AI.
# Requires repository secrets CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN (Workers AI: Read).

on:
  workflow_dispatch:
    inputs:
      model:
        description: Workers AI model
        default: "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
      variants:
        description: Comma-separated ablation variants
        default: "v1-baseline,v2-single,v2-repair,v2-constrained"

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run eval -- --provider workers-ai --model "${{ inputs.model }}" --variants "${{ inputs.variants }}" --concurrency 3 --out eval-run --publish
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - run: cat eval-run/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: eval-run
          path: |
            eval-run
            ml/evals/results/eval-latest.json
