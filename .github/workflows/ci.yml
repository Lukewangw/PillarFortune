name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, unit tests, builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:pages

  router:
    name: Router training pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/router/requirements.txt
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: pip install -r ml/router/requirements.txt
      - run: npm ci
      # Retrain from the committed data, then check train/serve parity and quality gates on the fresh model.
      - run: python ml/router/train.py
      - run: npx vitest run src/core/router
      - run: npx tsx ml/router/evaluate.ts
      - name: Quality gate (dev split)
        run: |
          node -e '
            const m = require("./ml/router/reports/system-metrics.json").splits.dev;
            const gates = { focusMacroF1: [m.focus.macro_f1, 0.7], safetyMacroF1: [m.safety.macro_f1, 0.7], crisisRecall: [m.crisis.recall.served, 0.85] };
            let ok = true;
            for (const [name, [value, min]] of Object.entries(gates)) { console.log(name, value, ">=", min); if (value < min) ok = false; }
            process.exit(ok ? 0 : 1);
          '

  e2e:
    name: Full-stack end-to-end (Worker + Durable Objects + D1, simulated model)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start the Worker locally
        run: |
          npx wrangler dev -c wrangler.test.jsonc --port 8787 --ip 127.0.0.1 > wrangler.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8787/api/health && break; sleep 1; done
      - run: npx tsx scripts/smoke-api.ts http://127.0.0.1:8787
      - run: npx playwright test
        env:
          E2E_BASE_URL: http://127.0.0.1:8787
      - if: failure()
        run: cat wrangler.log
